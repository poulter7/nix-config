name: Deploy OpenGrid to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'aws-opengrid/website/**'
      - 'aws-opengrid/deploy.sh'
      - '.github/workflows/deploy-opengrid.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Deploy to S3 and CloudFront
        env:
          BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME || 'jonathanpoulter-opengrid' }}
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          cd aws-opengrid
          
          echo "Uploading files to S3..."
          aws s3 sync ./website/ s3://${BUCKET_NAME}/opengrid/ \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude ".DS_Store" \
            --exclude "*.swp"
          
          if [ -n "$DISTRIBUTION_ID" ]; then
            echo "Creating CloudFront invalidation..."
            aws cloudfront create-invalidation \
              --distribution-id ${DISTRIBUTION_ID} \
              --paths "/opengrid/*"
          else
            echo "Warning: CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache invalidation"
          fi

      - name: Deployment summary
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Website URL**: https://jonathanpoulter.com/opengrid" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
